<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Events Demo</title>

    <link rel="styelsheet" href="/Events/style.css">
</head>

<body>
    <h1>JavaScript Events Demo</h1>

    <!-- Click Event -->
    <button id="clickBtn">Click Me</button>
    <br>
    <br>
    <!-- Double Click Event -->
    <button id="dblBtn">Double Click Me</button>

    <br>
    <br>
    <!-- Mouse Events -->
    <div id="box">
        Hover Over Me
    </div>

    <!-- Keyboard Events -->
    <input type="text" id="textInput" placeholder="Type Something">

    <p id="displayText"></p>

    <!-- Change Event -->
    <select id="city">
        <option>Pune</option>
        <option>Mumbai</option>
        <option>Nashik</option>
    </select>

    <br>
    <br>
    
    <!-- Submit Event -->
    <form id="myForm">
        <input type="text" placeholder="Enter Name" required>
        <button type="submit">Submit</button>
    </form>

    <!-- Scroll Position -->
    <h3 id="scrollValue"></h3>

    <!-- Event Bubbling -->
    <div id="parent">
        Parent 
        <br><br>
        <button id="child">Child Button</button>
    </div>

    <br>
    <br>

    <!-- preventDefault -->
    <a href="https://www.google.com" id="googleLink">
        Open Google
    </a>

    <br><br>

    <!-- Screen Checking -->
    <div id="content">
        <h2>Welcome To Website</h2>
    </div>

    <div id="warning">
        Website Available Only On Laptop/Desktop
    </div>
    <div style="height:1200px;"></div>

    <script src="/Events/script.js"></script>

</body>

</html>
