<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript Events Demo</title>

  </head>
  <body>
    <h1>JavaScript Event Examples</h1>

    <!-- Click Event -->
    <section>
      <h2>1. Click Event</h2>
      <button id="clickBtn">Click Me</button>
    </section>

    <!-- Double Click -->
    <section>
      <h2>2. Double Click Event</h2>
      <button id="dblBtn">Double Click Me</button>
    </section>

    <!-- Mouse Events -->
    <section>
      <h2>3. Mouse Events</h2>
      <div id="box">Hover On Me</div>
    </section>

    <!-- Keyboard Events -->
    <section>
      <h2>4. Keyboard Events</h2>
      <input type="text" id="keyboard" placeholder="Type Something" />
    </section>

    <!-- Input Event -->
    <section>
      <h2>5. Input Event</h2>
      <input type="text" id="liveInput" placeholder="Live Typing" />
      <p id="output"></p>
    </section>

    <!-- Change Event -->
    <section>
      <h2>6. Change Event</h2>

      <select id="city">
        <option>Select City</option>
        <option>Pune</option>
        <option>Mumbai</option>
        <option>Nashik</option>
      </select>
    </section>

    <!-- Submit Event -->
    <section>
      <h2>7. Submit Event</h2>
      <form id="form">
        <input type="text" placeholder="Enter Name" required />
        <button>Submit</button>
      </form>
    </section>

    <!-- Focus Blur -->
    <section>
      <h2>8. Focus & Blur</h2>
      <input type="text" id="focusInput" placeholder="Click Here" />
    </section>

    <!-- preventDefault -->
    <section>
      <h2>9. preventDefault()</h2>
      <a href="https://google.com" id="link"> Google </a>
    </section>
    <script src="script.js"></script>
  </body>
</html>
